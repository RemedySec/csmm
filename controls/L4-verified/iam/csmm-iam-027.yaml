id: "csmm-iam-027"
name: "IaC Scanned in CI/CD Before Merge"
level: 4
pillar: "iam"
priority: "critical"
severity_weight: 4

description: >
  All Infrastructure-as-Code pull requests must pass automated security scanning
  before merging to the main branch. Scanning must cover static analysis for
  misconfigurations (e.g., tfsec, Checkov, or Snyk IaC) and policy-as-code
  evaluation (e.g., OPA or Sentinel). The CI/CD pipeline must be configured to
  block merge on any HIGH or CRITICAL severity finding without an explicit approval
  exception documented in the change management system.

risk: >
  Unscanned IaC changes deploy misconfigurations directly to production environments
  where they may persist until the next audit cycle. Unlike application code where
  runtime errors are often immediately visible, infrastructure misconfigurations such
  as open security groups, disabled encryption, or excessive IAM permissions can
  remain silent and exploitable for months without proactive detection in the pipeline.

verification:
  - "Review CI/CD pipeline definitions for all IaC repositories and confirm a security scanning step exists that runs on every pull request"
  - "Trigger a test PR containing a known misconfiguration (e.g., an S3 bucket with public access) and confirm the pipeline fails and blocks merge"
  - "Review the scanner configuration to confirm HIGH and CRITICAL checks are set to fail the build rather than warn"
  - "Verify branch protection requires the IaC scan status check: gh api repos/{owner}/{repo}/branches/main --jq '.protection.required_status_checks.contexts' must include the scan step name. Exceptions require a PR approval from a user with the security-reviewer team membership."

compliance:
  - framework: "SOC2"
    control: "CC8.1"
  - framework: "NIST 800-53"
    control: "SA-11"

references:
  - "https://www.checkov.io/1.Welcome/Quick%20Start.html"
  - "https://docs.aws.amazon.com/codepipeline/latest/userguide/tutorials.html"
  - "https://developer.hashicorp.com/sentinel/docs/concepts/policy-as-code"
