id: "csmm-mon-019"
name: "Threat Hunting Program"
level: 4
pillar: "monitoring"
priority: "medium"
severity_weight: 2

description: >
  Establish a proactive threat hunting cadence — at least 2 documented hunts per
  month, each targeting a distinct MITRE ATT&CK Cloud technique — where security
  analysts form hypotheses about attacker TTPs and systematically search for
  indicators across the centralized security data lake. Each hunt report must
  contain: hypothesis, ATT&CK technique ID, queries executed, findings, and any
  new detection rules created. Target: cover at least 30% of MITRE ATT&CK Cloud
  techniques within 12 months.
  Each hunt that discovers a gap must produce a new automated detection rule
  in GuardDuty custom threat lists, CloudWatch Insights queries, or SIEM
  correlation rules. Track ATT&CK technique coverage percentage over time.

risk: >
  Reactive alerting only catches known attack patterns. Sophisticated adversaries
  use novel techniques, living-off-the-land approaches, and slow-and-low methods
  designed to stay below detection thresholds. Without proactive hunting, these
  threats persist for weeks or months. Threat hunting converts unknown threats
  into known detections, continuously expanding your detection coverage.

verification:
  - "Confirm a threat hunting schedule exists with at least monthly cadence"
  - "Review the last 3 hunt reports for structured hypotheses, queries used, and findings"
  - "Verify at least 5 new detection rules were created from hunt findings in the last quarter"
  - "Confirm MITRE ATT&CK Cloud technique coverage is tracked and improving quarter over quarter"
  - "Validate that threat intelligence feeds inform hunt hypotheses"

compliance:
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "RA-5"

references:
  - "https://attack.mitre.org/matrices/enterprise/cloud/"
  - "https://docs.aws.amazon.com/prescriptive-guidance/latest/aws-security-controls/detective-controls.html"
  - "https://aws.amazon.com/blogs/security/how-to-use-amazon-guardduty-and-aws-organizations-to-enhance-your-security-posture/"
