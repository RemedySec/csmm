id: "csmm-cmp-012"
name: "SSM-Managed Instances (No SSH Keys)"
level: 4
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  All EC2 instances must be managed exclusively through AWS Systems Manager Session
  Manager for interactive access, with no SSH key pairs assigned at instance launch
  and no inbound rules permitting port 22 in associated security groups. The SSM
  Agent must be running and the instance profile must grant the AmazonSSMManagedInstanceCore
  policy to enable Session Manager connectivity.

risk: >
  SSH key pairs are difficult to rotate, easy to copy, and often stored insecurely
  on developer workstations, in password managers shared across teams, or committed
  to repositories. Unlike SSH, SSM Session Manager provides a full audit trail of
  every session and command through CloudTrail and session logging to S3 or
  CloudWatch Logs, making access fully attributable and reviewable.

verification:
  - "List all EC2 instances with key pairs assigned: aws ec2 describe-instances --query 'Reservations[*].Instances[?KeyName!=null].{ID:InstanceId,Key:KeyName}'"
  - "Confirm no security group associated with managed instances allows inbound TCP port 22 from 0.0.0.0/0 or ::/0"
  - "Verify SSM Fleet Manager shows all instances as Online and managed: aws ssm describe-instance-information"
  - "Test Session Manager connectivity to a sample instance and confirm the session is logged to the designated S3 bucket or CloudWatch log group"

compliance:
  - framework: "SOC2"
    control: "CC6.2"
  - framework: "NIST 800-53"
    control: "AC-17"

references:
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-getting-started-instance-profile.html"
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-logging.html"
