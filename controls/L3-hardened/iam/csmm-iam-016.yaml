id: "csmm-iam-016"
name: "Permission Boundaries on All Non-Admin Roles"
level: 3
pillar: "iam"
priority: "high"
severity_weight: 3

description: >
  All non-administrative IAM roles must have a permission boundary policy attached
  that restricts the maximum effective permissions the role can exercise. Permission
  boundaries act as a hard ceiling regardless of what identity-based policies grant,
  preventing privilege escalation through role assumption chains.

risk: >
  Without permission boundaries, any non-admin role that can create or modify IAM
  policies can escalate its own privileges to full administrative access. This creates
  an implicit privilege escalation path that is difficult to detect through policy
  reviews alone and can be exploited by compromised application credentials.

verification:
  - "List all IAM roles: aws iam list-roles --query 'Roles[*].{Name:RoleName,Boundary:PermissionsBoundary}'"
  - "Filter roles missing a permission boundary and confirm none are non-admin roles"
  - "For each role with a boundary, verify the boundary policy explicitly denies iam:CreatePolicy, iam:AttachRolePolicy, and iam:PutRolePolicy"
  - "Confirm boundary policies are managed centrally and not modifiable by role owners"

compliance:
  - framework: "SOC2"
    control: "CC6.3"
  - framework: "NIST 800-53"
    control: "AC-6(1)"

references:
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#grant-least-privilege"
  - "https://aws.amazon.com/blogs/security/when-and-how-to-use-aws-iam-permission-boundaries/"
