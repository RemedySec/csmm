id: "csmm-iam-020"
name: "Enforce ABAC/RBAC Access Patterns"
level: 3
pillar: "iam"
priority: "medium"
severity_weight: 2

description: >
  Zero inline policies may be attached to IAM users — all access must be granted via
  managed policies attached to IAM roles or groups. All managed policies must include
  at least one tag-based condition key (aws:PrincipalTag, aws:ResourceTag, or
  aws:RequestTag) OR be attached to a role following the naming pattern
  {team}-{function}-role. All resources must carry mandatory tags: Team, Environment,
  and Service.

risk: >
  Without structured ABAC or RBAC patterns, access control devolves into per-user
  or per-resource inline policies that are impossible to audit at scale. Teams
  create one-off policies for each request, leading to thousands of unique policy
  documents with inconsistent scoping. This makes it infeasible to answer basic
  questions like "who can access production data?" and creates gaps that only
  surface during incidents.

verification:
  - "Run: aws iam list-users, then for each user run aws iam list-user-policies. Result must be empty for all users (zero inline policies)."
  - "Run: aws iam list-attached-user-policies for all users. Result must be empty (all policies attached via roles or groups, not users)."
  - "For all locally managed policies, retrieve the policy document and confirm it contains at least one Condition key from: aws:PrincipalTag, aws:ResourceTag, aws:RequestTag. Policies without conditions must be attached only to roles matching the naming pattern {team}-{function}-role."
  - "Verify Tag Policy enforces mandatory tags Team, Environment, Service via: aws organizations describe-policy for all tag policies."

compliance:
  - framework: "SOC2"
    control: "CC6.3"
  - framework: "NIST 800-53"
    control: "AC-3"
  - framework: "AWS Well-Architected"
    control: "SEC 03 — How do you manage permissions for people and machines?"

references:
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_attribute-based-access-control.html"
  - "https://docs.aws.amazon.com/whitepapers/latest/tagging-best-practices/tagging-best-practices.html"
