id: "csmm-iam-020"
name: "Deny IAM Admin Actions via Boundary"
level: 3
pillar: "iam"
priority: "critical"
severity_weight: 4

description: >
  Permission boundary policies must explicitly deny IAM administrative actions
  including iam:CreatePolicy, iam:AttachRolePolicy, iam:PutRolePolicy, iam:PassRole
  with wildcard resources, and iam:CreatePolicyVersion. These denies must be present
  even on roles that appear trusted, since boundaries are the last line of defense
  against privilege escalation.

risk: >
  Even roles considered trusted by developers or operators should not have unconstrained
  IAM modification capabilities; compromised credentials, supply-chain attacks, or
  insider threats can abuse IAM admin actions to silently elevate privileges. Without
  an explicit boundary-level deny, a single compromised role can create persistent
  backdoor access that survives incident response.

verification:
  - "Retrieve all permission boundary policies: aws iam list-policies --scope Local"
  - "For each boundary policy, check the policy document denies iam:Create*, iam:Attach*, iam:Put*, iam:PassRole on resource '*'"
  - "Confirm no boundary policy contains an Allow on iam:* that would override the deny"
  - "Validate that SCPs at the organization level reinforce these denies as a secondary control"

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "AC-6(2)"

references:
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"
  - "https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"
