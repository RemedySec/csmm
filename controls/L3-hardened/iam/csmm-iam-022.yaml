id: "csmm-iam-022"
name: "Periodic Least Privilege Access Review"
level: 3
pillar: "iam"
priority: "high"
severity_weight: 3

description: >
  IAM Access Analyzer unused access findings older than 90 days must be auto-escalated
  via Security Hub to a ticket system with an assigned owner. Findings unresolved after
  14 additional days trigger automatic policy scoping using Access Analyzer policy
  generation to produce right-sized replacement policies. No IAM policy may grant
  Action: '*' on Resource: '*' outside of roles tagged RoleType=BreakGlass.

risk: >
  Permissions accumulate over time as teams request access for projects, migrations,
  and incidents but rarely relinquish them afterward. This privilege creep creates
  an ever-expanding blast radius — a compromised role with months of accumulated
  unused permissions grants attackers far broader access than the role's current
  function requires.

verification:
  - "Count Access Analyzer unused access findings older than 90 days: aws accessanalyzer list-findings — result must be zero or all must have linked tickets."
  - "List all IAM policies: aws iam list-policies --scope Local and inspect each policy document. Zero policies may contain Action: '*' with Resource: '*' unless attached to a role tagged RoleType=BreakGlass."
  - "Verify EventBridge rule exists that routes Access Analyzer findings to a ticket system (Jira, ServiceNow, or equivalent)."
  - "Confirm at least one policy was auto-scoped in the last 90 days by checking Access Analyzer policy generation history."

compliance:
  - framework: "SOC2"
    control: "CC6.3"
  - framework: "NIST 800-53"
    control: "AC-6(7)"
  - framework: "ISO 27001"
    control: "A.9.2.5"
  - framework: "AWS Well-Architected"
    control: "SEC 03 — How do you manage permissions for people and machines?"

references:
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_access-advisor.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#grant-least-privilege"
