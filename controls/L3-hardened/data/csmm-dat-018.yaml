id: "csmm-dat-018"
name: "No Hardcoded Secrets in IaC"
level: 3
pillar: "data"
priority: "critical"
severity_weight: 4

description: >
  Infrastructure-as-Code templates, modules, and variable files must not contain
  hardcoded secrets including passwords, API keys, private certificates, or tokens.
  All sensitive values must be sourced at runtime from AWS Secrets Manager, AWS
  Systems Manager Parameter Store (SecureString), or environment-injected CI/CD
  variables that are never written to disk or version control.

risk: >
  Secrets committed to source control are permanently exposed in git history even
  after deletion from the HEAD revision; any repository clone, fork, or backup
  retains the secret indefinitely. Automated scanning by threat actors routinely
  targets public and leaked private repositories, meaning a single accidental commit
  can lead to credential theft weeks or months after the original exposure.

verification:
  - "Run a secrets scanning tool (e.g., truffleHog, gitleaks, detect-secrets) against the full git history of all IaC repositories"
  - "Confirm CI/CD pipelines include a pre-merge secrets scanning step that blocks PRs on detection"
  - "Search Terraform variable files for sensitive variable definitions that do not have sensitive = true and lack a default of null"
  - "Audit Secrets Manager and SSM Parameter Store to confirm all secrets referenced in IaC exist there and are not duplicated as plaintext Terraform variables"

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "IA-5(7)"

references:
  - "https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html"
  - "https://developer.hashicorp.com/terraform/tutorials/configuration-language/sensitive-variables"
