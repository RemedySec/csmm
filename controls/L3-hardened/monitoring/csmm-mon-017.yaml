id: "csmm-mon-017"
name: "Centralized Security Observability Architecture"
level: 3
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  All security-relevant logs must flow into a centralized security data lake or
  SIEM with cross-account, cross-region aggregation. At minimum: CloudTrail
  (management and data events), VPC Flow Logs, Route53 DNS query logs, GuardDuty
  findings, Security Hub findings, WAF logs, and application authentication logs.
  Logs must be normalized into a common schema (e.g., OCSF) for correlation.
  Retention must be tiered: hot storage (30 days) for active investigation,
  warm (90 days) for threat hunting, cold (1 year+) for compliance. The
  architecture must support sub-minute query latency on hot data.

risk: >
  Scattered logs across individual accounts, regions, and services make
  investigation impossible under time pressure. During an incident, analysts
  waste hours collecting logs from dozens of sources instead of correlating
  events. Without a centralized architecture, you have monitoring — individual
  alarms firing in isolation — but not observability, the ability to understand
  what happened across your entire environment in a single pane.

verification:
  - "Confirm a centralized log destination (S3 + Athena, Security Lake, or third-party SIEM) receives logs from all accounts"
  - "Verify CloudTrail, VPC Flow Logs, DNS logs, GuardDuty, Security Hub, and WAF logs are all ingested"
  - "Confirm log normalization into a common schema (OCSF or equivalent) is in place"
  - "Test that a cross-account query returns results within 60 seconds for the last 30 days"
  - "Verify tiered retention policies are configured (hot/warm/cold)"

compliance:
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AU-6"
  - framework: "AWS Well-Architected"
    control: "SEC 04 — How do you detect and investigate security events?"

references:
  - "https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html"
  - "https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/security-ou-and-accounts.html"
  - "https://schema.ocsf.io/"
