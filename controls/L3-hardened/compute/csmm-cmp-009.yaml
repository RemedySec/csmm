id: "csmm-cmp-009"
name: "Lambda No Wildcard IAM Permissions"
level: 3
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  Lambda execution roles must not contain wildcard action statements (Action: "*")
  or wildcard resource statements (Resource: "*") in any attached or inline policy.
  Each Lambda function's role must be scoped to only the specific AWS actions and
  resource ARNs required for that function's documented purpose, following least
  privilege at the function level.

risk: >
  Overprivileged Lambda execution roles dramatically amplify the blast radius of any
  code-level vulnerability such as SSRF, remote code execution, or dependency
  compromise. An attacker who achieves code execution within a Lambda function can
  use wildcard permissions to exfiltrate data, move laterally to other services, or
  establish persistence, turning a single vulnerable function into a full account
  compromise.

verification:
  - "List all Lambda functions and their execution role ARNs: aws lambda list-functions --query 'Functions[*].{Name:FunctionName,Role:Role}'"
  - "For each execution role, retrieve all attached and inline policies and check for Action: '*' or Resource: '*' in Allow statements"
  - "Use IAM Access Analyzer policy validation to flag overly permissive Lambda role policies"
  - "Confirm no Lambda role has AdministratorAccess, PowerUserAccess, or any AWS-managed policy granting broad permissions"

compliance:
  - framework: "SOC2"
    control: "CC6.3"
  - framework: "NIST 800-53"
    control: "AC-6(1)"

references:
  - "https://docs.aws.amazon.com/lambda/latest/dg/lambda-permissions.html"
  - "https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_access-advisor.html"
