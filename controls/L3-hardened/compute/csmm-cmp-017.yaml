id: "csmm-cmp-017"
name: "Container Security Architecture"
level: 3
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  All container workloads must follow a layered security architecture: all ECS task
  definitions and EKS pod specs must reference images from ECR registries owned by
  accounts listed in an approved account allowlist. ECR enhanced scanning must be
  enabled on all repositories with scan-on-push. ECR image
  scanning enabled with critical/high findings blocking deployment, container images
  signed using Sigstore/cosign or AWS Signer with signature verification enforced
  at deploy time, and runtime security monitoring via GuardDuty ECS/EKS Runtime
  Monitoring. Containers must run as non-root users, with read-only root filesystems,
  and no privileged mode or host namespace sharing. Exceptions must be tagged on the
  image: SecurityException=approved with ExceptionExpiry={YYYY-MM-DD}. Images with
  CRITICAL ECR scan findings cannot be deployed unless tagged with an active exception.

risk: >
  Containers inherit the security posture of their base images. Public base images
  frequently contain known vulnerabilities, embedded malware, or unnecessary
  packages that expand attack surface. Without image signing, a compromised CI/CD
  pipeline or registry can inject malicious images that deploy to production
  unchallenged. Without runtime monitoring, container escapes, cryptomining, and
  lateral movement go undetected.

verification:
  - "Confirm ECR is the sole image source — ECS/EKS policies reject images from non-approved registries"
  - "Verify ECR scanning is enabled and CI/CD pipelines fail on critical/high findings"
  - "Confirm image signing is enforced and unsigned images cannot be deployed"
  - "Verify all ECS task definitions use non-root users, read-only root filesystems, and no privileged mode"
  - "Confirm GuardDuty ECS/EKS Runtime Monitoring is enabled in all accounts"

compliance:
  - framework: "SOC2"
    control: "CC6.8"
  - framework: "NIST 800-53"
    control: "SI-7"
  - framework: "AWS Well-Architected"
    control: "SEC 06 — How do you protect your compute resources?"

references:
  - "https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html"
  - "https://docs.aws.amazon.com/signer/latest/developerguide/Welcome.html"
  - "https://docs.aws.amazon.com/guardduty/latest/ug/ecs-runtime-monitoring.html"
  - "https://docs.aws.amazon.com/AmazonECS/latest/bestpracticesguide/security.html"
