id: "csmm-cmp-018"
name: "Workload Isolation Strategy"
level: 3
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  Workloads must be isolated based on data classification and trust level using
  the strongest isolation boundary appropriate: separate AWS accounts for different
  trust levels, Fargate for multi-tenant workloads (kernel-level isolation via
  Firecracker), dedicated EKS node groups or Fargate profiles per namespace for
  Kubernetes, and separate VPCs for workloads with different security requirements.
  Shared EC2 instances must not host workloads from different trust levels.
  Service mesh (e.g., App Mesh) or network policies must enforce workload-to-workload
  authentication and authorization.

risk: >
  Shared compute without isolation boundaries means a compromised workload can
  access memory, storage, and network resources of co-located workloads. Container
  escapes on shared EC2 hosts give attackers access to all containers on that host.
  Without workload isolation, a vulnerability in a low-criticality application
  becomes a direct path to high-criticality data through lateral movement on
  shared infrastructure.

verification:
  - "Confirm production and non-production workloads run in separate AWS accounts"
  - "Verify multi-tenant or sensitive workloads use Fargate (not shared EC2 instances)"
  - "Confirm EKS clusters use separate node groups or Fargate profiles per security boundary"
  - "Validate Kubernetes network policies or service mesh enforce workload-to-workload authorization"
  - "Review any shared EC2 instances and confirm they only host workloads of the same trust level"

compliance:
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-39"
  - framework: "AWS Well-Architected"
    control: "SEC 06 — How do you protect your compute resources?"

references:
  - "https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/protecting-compute.html"
  - "https://docs.aws.amazon.com/eks/latest/best-practices/security.html"
  - "https://aws.amazon.com/blogs/containers/tenant-isolation-for-saas-on-eks/"
