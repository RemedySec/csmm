id: "csmm-net-018"
name: "Network Segmentation Strategy"
level: 3
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  Implement a documented network segmentation strategy using separate VPCs per
  workload classification (production, staging, development, shared services) with
  explicit inter-VPC connectivity via Transit Gateway or VPC peering. Each VPC must
  have tiered subnets (public, private, isolated) with workloads placed in the most
  restrictive tier possible. Cross-environment traffic must traverse inspection points
  (Network Firewall or third-party appliances) with deny-by-default routing.

risk: >
  Without deliberate segmentation, a flat network allows lateral movement from any
  compromised workload to every other resource in the environment. A single breached
  EC2 instance in a development subnet can reach production databases, internal APIs,
  and management planes. Segmentation limits blast radius and forces attackers through
  chokepoints where detection and prevention controls are concentrated.

verification:
  - "Confirm a network segmentation design document exists mapping VPCs to workload classifications"
  - "Verify production VPCs have no direct peering to development or sandbox VPCs"
  - "Validate Transit Gateway route tables enforce deny-by-default between security domains"
  - "Confirm workloads are placed in private or isolated subnets unless they explicitly require public ingress"
  - "Test that cross-environment traffic is routed through an inspection VPC with Network Firewall"

compliance:
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"
  - framework: "AWS Well-Architected"
    control: "SEC 05 — How do you protect your network resources?"

references:
  - "https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/welcome.html"
  - "https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html"
  - "https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html"
