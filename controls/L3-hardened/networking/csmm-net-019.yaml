id: "csmm-net-019"
name: "Egress Filtering Architecture"
level: 3
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  All outbound internet traffic from VPCs must pass through a centralized egress
  inspection point — either AWS Network Firewall, a proxy fleet (e.g., Squid,
  Zscaler), or a third-party NGFW — with deny-by-default rules. Allowlisted
  destinations must be domain-based (not IP-based) and scoped per service, with each Network Firewall rule group tagged Service={name} to identify the workload it serves. Maximum 50 domain entries per rule group.
  Direct internet egress via NAT Gateway without inspection must be prohibited.
  DNS-based egress filtering via Route53 Resolver DNS Firewall must supplement
  network-layer controls.

risk: >
  Unrestricted egress allows compromised workloads to exfiltrate data to
  attacker-controlled infrastructure, download additional tooling, establish
  reverse shells, and communicate with command-and-control servers. Most AWS
  environments allow all outbound traffic by default, making post-exploitation
  trivial. Egress filtering is the single most impactful control for limiting
  the damage of a compromised instance.

verification:
  - "Confirm all VPC route tables direct 0.0.0.0/0 traffic through a centralized inspection VPC or firewall endpoint"
  - "Verify Network Firewall or proxy rules use deny-by-default with explicit domain allowlists per workload"
  - "Confirm Route53 Resolver DNS Firewall is enabled with blocklists for known malicious domains"
  - "Test from a production instance: curl -s -o /dev/null -w '%{http_code}' https://example.com must return 000 or timeout (blocked). curl against an allowlisted domain must return 200."
  - "Verify egress filtering logs are shipped to SIEM for anomaly detection"

compliance:
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7(5)"
  - framework: "MITRE ATT&CK"
    control: "T1048 — Exfiltration Over Alternative Protocol"

references:
  - "https://docs.aws.amazon.com/network-firewall/latest/developerguide/stateful-rule-groups-domain-names.html"
  - "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dns-firewall.html"
  - "https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-egress.html"
