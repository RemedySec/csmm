id: "csmm-str-023"
name: "Data Classification and Tagging Strategy"
level: 3
pillar: "storage"
priority: "high"
severity_weight: 3

description: >
  All data stores (S3 buckets, RDS instances, DynamoDB tables, EFS file systems,
  EBS volumes) must be tagged with a mandatory data classification label
  (e.g., Public, Internal, Confidential, Restricted) and a data owner tag.
  Classification drives automated policy enforcement — encryption key selection,
  backup frequency, access controls, and retention periods must vary by
  classification. Use AWS Config rules or Tag Policies to enforce mandatory tags
  and Macie to auto-discover and classify sensitive data in S3.

risk: >
  Without data classification, all data receives the same security controls
  regardless of sensitivity. This leads to either over-investment in protecting
  low-value data or — far more commonly — under-protection of sensitive data
  because teams default to the lowest common denominator. You cannot protect
  what you haven't classified, and you cannot audit access without knowing what
  data lives where.

verification:
  - "Confirm Tag Policies enforce mandatory Classification and DataOwner tags on all storage resources"
  - "Verify AWS Config rules flag resources missing classification tags as non-compliant"
  - "Confirm Amazon Macie is enabled and running scheduled discovery jobs on all S3 buckets"
  - "Validate that encryption, backup, and access policies vary by classification level"
  - "Review a sample of Restricted-classified resources and confirm access is scoped to authorized roles only"

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "RA-2"
  - framework: "ISO 27001"
    control: "A.8.2.1"

references:
  - "https://docs.aws.amazon.com/whitepapers/latest/data-classification/data-classification.html"
  - "https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html"
  - "https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html"
