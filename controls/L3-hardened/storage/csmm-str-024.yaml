id: "csmm-str-024"
name: "Encryption Key Management Architecture"
level: 3
pillar: "storage"
priority: "high"
severity_weight: 3

description: >
  Implement a structured KMS key hierarchy with minimum KMS key separation:
  one key per (Classification x Environment) pair. Key aliases must follow the
  naming pattern alias/{env}-{classification}-{service}. Key policies must not
  contain Principal: '*' or Principal: {AWS: 'arn:aws:iam::ACCOUNT:root'}.
  Key policies must follow least privilege — only the owning workload's roles
  should have kms:Encrypt and kms:Decrypt grants. Cross-account key sharing
  must use key grants (not broad key policies) with GrantIsForAWSResource
  constraints. A central security account must hold administrative key policies
  while workload accounts hold usage grants only. Key deletion must require
  multi-party approval.

risk: >
  A single shared KMS key across workloads means that any role with decrypt
  permissions can access all encrypted data regardless of ownership. This
  collapses encryption into a checkbox exercise rather than an access control
  mechanism. Without a key hierarchy, key compromise or over-permissioning
  affects all data simultaneously rather than being scoped to a single workload.

verification:
  - "Confirm separate KMS keys exist per data classification level and per production workload"
  - "Verify key policies restrict kms:Decrypt to the owning workload's execution roles only"
  - "Confirm cross-account key access uses grants with GrantIsForAWSResource, not wildcard key policies"
  - "Verify key deletion requires a waiting period of at least 14 days and triggers alerts"
  - "Retrieve all KMS key policies and verify none contain Principal: '*' or the account root ARN as a direct grantee. Key aliases must match the pattern alias/{env}-{classification}-{service}."

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "SC-12"
  - framework: "AWS Well-Architected"
    control: "SEC 08 — How do you protect your data at rest?"

references:
  - "https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html"
  - "https://docs.aws.amazon.com/kms/latest/developerguide/grants.html"
  - "https://docs.aws.amazon.com/prescriptive-guidance/latest/encryption-keys-management/welcome.html"
