id: "csmm-aut-009"
name: "Self-Healing Infrastructure"
level: 5
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  Compute infrastructure must implement continuous self-healing mechanisms that
  detect and correct configuration drift without human intervention. SSM State Manager
  association compliance must be at least 95%. AWS Config auto-remediation must execute
  within 30 minutes of a non-compliant evaluation. This includes AWS Systems Manager
  State Manager associations that enforce desired configuration, Auto Scaling group
  health checks that replace unhealthy instances, and Config remediation rules that
  automatically correct compute
  misconfigurations such as missing agents, disabled logging, or non-compliant
  instance types.

risk: >
  Configuration drift accumulates gradually across long-running instances through
  manual changes, failed patch cycles, agent crashes, and ad-hoc troubleshooting.
  Without self-healing, drifted instances silently lose security controls like
  endpoint detection agents, log forwarding, and vulnerability scanners, creating
  exploitable gaps that are invisible to monitoring systems designed around the
  expected configuration state.

verification:
  - "List active SSM State Manager associations and confirm they target all production instance fleets with a compliance schedule of 30 minutes or less"
  - "Run: aws ssm list-compliance-summaries — compliant percentage must be >= 95%"
  - "Run: aws configservice get-compliance-details-by-config-rule and verify mean time between non-compliant evaluation and remediation is <= 30 minutes"
  - "Intentionally break a configuration item (e.g., stop the CloudWatch agent) on a test instance and confirm State Manager restores it within the next association run"
  - "Verify Auto Scaling group health check type is set to ELB (not EC2 only) for all load-balanced instance groups to enable application-level health enforcement"

compliance:
  - framework: "SOC2"
    control: "CC7.1"
  - framework: "NIST 800-53"
    control: "CM-3"

references:
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-state-manager.html"
  - "https://docs.aws.amazon.com/autoscaling/ec2/userguide/healthcheck.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/remediation.html"
