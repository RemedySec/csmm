id: "csmm-mon-012"
name: "Automated Incident Response (SOAR)"
level: 5
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  High-confidence security events must trigger fully automated containment
  actions without human intervention. Implement SOAR (Security Orchestration,
  Automation and Response) playbooks for: isolating compromised EC2 instances
  (swap SG to forensic-only), disabling compromised IAM credentials, blocking
  malicious IPs in WAF and NACLs, quarantining infected containers, revoking
  active sessions for compromised users, and snapshotting volumes for forensic
  preservation — all within 5 minutes of detection. Human review follows
  automated containment, not precedes it. All automated actions must be
  logged with full context for post-incident review.

risk: >
  Human-in-the-loop response introduces minutes to hours of delay depending on
  analyst availability, alert fatigue, and decision-making under pressure. For
  high-confidence detections (e.g., confirmed cryptominer, credential use from
  known malicious IP), delayed containment means continued data exfiltration,
  lateral movement, and resource abuse. Automated response reduces mean time
  to contain from hours to seconds for known threat patterns.

verification:
  - "Confirm SOAR playbooks exist for at least 6 high-confidence scenarios (instance compromise, credential compromise, malicious IP, etc.)"
  - "Test that a simulated GuardDuty CryptoCurrency finding triggers automatic instance isolation within 5 minutes"
  - "Verify compromised credential playbook disables access keys and revokes sessions automatically"
  - "Confirm all automated actions are logged with event context, action taken, and timestamp"
  - "Verify human review queue receives notifications for all automated containment actions"

compliance:
  - framework: "SOC2"
    control: "CC7.3"
  - framework: "NIST 800-53"
    control: "IR-4(1)"

references:
  - "https://docs.aws.amazon.com/incident-manager/latest/userguide/what-is-incident-manager.html"
  - "https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html"
  - "https://aws.amazon.com/blogs/security/how-to-automate-incident-response-in-aws/"
