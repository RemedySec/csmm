id: "csmm-iam-027"
name: "Auto-Remediation for L1 Controls"
level: 5
pillar: "iam"
priority: "high"
severity_weight: 3

description: >
  All Level 1 (Exposed) control violations must trigger automated remediation
  within a maximum response window of 15 minutes, measured as the time between AWS
  Config recording a non-compliant evaluation and the subsequent compliant
  re-evaluation, for critical findings.
  Remediation actions must be implemented via AWS Config Remediation, Security Hub
  custom actions, or Lambda-backed EventBridge rules, and every automated action
  must be logged with before-and-after state to a tamper-evident audit log for
  change management traceability.

risk: >
  Manual remediation of critical misconfigurations such as publicly exposed S3
  buckets or open security groups is too slow; the average time-to-detect and
  time-to-remediate through human processes routinely exceeds hours or days, during
  which production data is exposed. Automated remediation closes the window of
  exposure before threat actors can discover and exploit the misconfiguration.

verification:
  - "List all AWS Config remediation configurations and confirm L1 control rules have automated remediation attached"
  - "Trigger a test L1 violation (e.g., enable public access on a test S3 bucket) and confirm auto-remediation fires within the SLA window"
  - "Review CloudTrail for the remediation Lambda or SSM automation execution and confirm state changes are logged"
  - "Verify SNS topic for auto-remediation notifications exists and has zero failed deliveries: check CloudWatch metric NumberOfNotificationsFailed for the topic. All remediation actions must appear in CloudTrail with invokedBy showing config.amazonaws.com or lambda.amazonaws.com."

compliance:
  - framework: "SOC2"
    control: "CC7.3"
  - framework: "NIST 800-53"
    control: "IR-4"

references:
  - "https://docs.aws.amazon.com/config/latest/developerguide/remediation.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-custom-actions.html"
  - "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-cases.html"
