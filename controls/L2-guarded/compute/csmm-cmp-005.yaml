id: "csmm-cmp-005"
name: "Enforce IMDSv2 on All Instances"
level: 2
pillar: "compute"
priority: "critical"
severity_weight: 4

description: >
  All EC2 instances must be configured to require Instance Metadata Service
  version 2 (IMDSv2) by setting HttpTokens to required in the instance metadata
  options. IMDSv1, which allows unauthenticated GET requests to the metadata
  endpoint, must be disabled. This setting must be applied at launch and
  enforced via AWS Config remediation for any existing non-compliant instances.

risk: >
  IMDSv1 is trivially exploitable through Server-Side Request Forgery (SSRF)
  vulnerabilities in web applications running on EC2. An attacker who can cause
  a server-side HTTP request to be made to 169.254.169.254 can retrieve the
  instance's IAM role credentials, which grant access to AWS APIs with the full
  permissions of that role. This is one of the most commonly exploited
  vulnerabilities in cloud environments and has been the root cause of several
  high-profile data breaches involving S3 and other AWS services.

verification:
  - "Run aws ec2 describe-instances and check MetadataOptions.HttpTokens for each instance — flag any instance where HttpTokens is optional."
  - "Deploy AWS Config rule ec2-imdsv2-check and verify compliance across all accounts and regions."
  - "Confirm that launch templates, AMI defaults, and Auto Scaling Group configurations all set HttpTokens: required."
  - "Set the account-level IMDS default via aws ec2 modify-instance-metadata-defaults --http-tokens required to ensure new instances default to IMDSv2."

compliance:
  - framework: "CIS AWS Foundations"
    control: "5.6"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "AC-3"

references:
  - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/ec2-imdsv2-check.html"
  - "https://aws.amazon.com/blogs/security/get-the-full-benefits-of-imdsv2-and-disable-imdsv1-across-your-aws-infrastructure/"
