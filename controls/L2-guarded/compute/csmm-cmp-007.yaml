id: "csmm-cmp-007"
name: "No Secrets or Credentials in Lambda Environment Variables"
level: 2
pillar: "compute"
priority: "critical"
severity_weight: 4

description: >
  Lambda function environment variables must not contain plaintext secrets,
  API keys, passwords, tokens, or connection strings. All sensitive values
  must be stored in AWS Secrets Manager or SSM Parameter Store (SecureString)
  and retrieved at runtime. Environment variables that are present must be
  encrypted with a customer-managed KMS key — not the default Lambda service
  key — so that access to the key can be independently controlled and audited.

risk: >
  Lambda environment variables are accessible to anyone with lambda:GetFunction
  or lambda:GetFunctionConfiguration permissions — a broadly granted permission
  in many environments. Secrets stored in environment variables are also visible
  in the Lambda console, in CloudFormation templates, in Terraform state files,
  and in any CI/CD pipeline that deploys the function. A single IAM credential
  compromise that includes lambda:GetFunction can harvest all secrets across
  every function in the account simultaneously.

verification:
  - "For each Lambda function: aws lambda get-function-configuration --function-name <name> | jq '.Environment.Variables' — scan values for patterns matching secrets (keys, tokens, passwords, connection strings)."
  - "Use automated secret detection tooling (e.g. truffleHog, detect-secrets, or AWS Macie Lambda scanning) to scan environment variable values across all functions."
  - "Confirm KmsKeyArn is set to a customer-managed CMK, not the default aws/lambda key: aws lambda get-function-configuration --query 'KMSKeyArn'"
  - "AWS Config rule: lambda-no-plaintext-secrets — deploy if available, otherwise implement a custom Config rule using a Lambda evaluator."

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "IA-5"
  - framework: "AWS Well-Architected"
    control: "SEC 09 — How do you protect your data in transit?"

references:
  - "https://docs.aws.amazon.com/lambda/latest/dg/configuration-envvars.html"
  - "https://docs.aws.amazon.com/secretsmanager/latest/userguide/integrating_lambda.html"
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/integration-ps-secretsmanager.html"
