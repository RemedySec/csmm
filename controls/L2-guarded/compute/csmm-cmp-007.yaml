id: "csmm-cmp-007"
name: "Use Launch Templates Not Launch Configurations"
level: 2
pillar: "compute"
priority: "medium"
severity_weight: 2

description: >
  All Auto Scaling Groups must use EC2 Launch Templates rather than the
  deprecated Launch Configurations API. Launch Configurations must not be
  created for new workloads, and any existing Auto Scaling Groups still
  referencing Launch Configurations must be migrated to Launch Templates.
  Launch Templates should use versioning to track changes and enable safe
  rollback.

risk: >
  Launch Configurations are a legacy API that does not support critical security
  settings including IMDSv2 enforcement, Nitro-based instance type requirements,
  and other instance metadata options. Because Launch Configurations are
  immutable and cannot be updated in place, teams are often forced to work
  around limitations rather than applying security settings, leading to
  persistent misconfigurations. AWS has announced that Launch Configurations
  will not receive new feature support, meaning security gaps will widen over
  time.

verification:
  - "Run aws autoscaling describe-auto-scaling-groups across all regions and flag any ASG where LaunchConfigurationName is set instead of LaunchTemplate."
  - "Confirm no new Launch Configurations are being created by reviewing CloudTrail for recent CreateLaunchConfiguration API calls."
  - "Verify that all Launch Templates include MetadataOptions with HttpTokens set to required."
  - "Check that Launch Template versioning is used and that ASGs reference a specific version or $Latest with a change management process in place."

compliance:
  - framework: "SOC2"
    control: "CC7.1"
  - framework: "NIST 800-53"
    control: "CM-2"

references:
  - "https://docs.aws.amazon.com/autoscaling/ec2/userguide/launch-templates.html"
  - "https://docs.aws.amazon.com/autoscaling/ec2/userguide/migrate-to-launch-templates.html"
  - "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-launch-templates.html"
