id: "csmm-cmp-008"
name: "ECR Image Scan on Push Enabled"
level: 2
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  All Amazon ECR repositories must have scan-on-push enabled so that every
  container image is automatically scanned for known CVEs immediately after
  being pushed. Enhanced scanning (using Amazon Inspector) is preferred over
  basic scanning as it provides continuous re-scanning as new vulnerabilities
  are disclosed and covers OS packages and application dependencies. Images
  with CRITICAL severity findings must not be deployed to production without
  a documented exception and remediation timeline.

risk: >
  Container images frequently contain vulnerable OS packages, outdated runtimes,
  and third-party libraries with known CVEs. Without scan-on-push, vulnerable
  images are deployed to production silently and accumulate over time as new
  CVEs are disclosed against dependencies that were clean at build time.
  A compromised container runtime is an attacker's entry point into the cluster
  or host, from which they can access the EC2 instance profile credentials,
  reach the container network, and attempt to escape to the host.

verification:
  - "List all ECR repositories: aws ecr describe-repositories | jq '.repositories[] | {name: .repositoryName, scanOnPush: .imageScanningConfiguration.scanOnPush}' — confirm scanOnPush is true for all."
  - "For enhanced scanning: aws inspector2 list-coverage --filter-criteria '{\"ecrRepositoryName\":[{\"comparison\":\"NOT_EQUALS\",\"value\":\"none\"}]}' — confirm all repositories are covered."
  - "Review recent scan findings: aws ecr describe-image-scan-findings — confirm no CRITICAL findings are present in images currently deployed to production."
  - "AWS Config rule: ecr-private-image-scanning-enabled — deploy and confirm zero non-compliant repositories."

compliance:
  - framework: "SOC2"
    control: "CC7.1"
  - framework: "NIST 800-53"
    control: "SI-2"
  - framework: "AWS Well-Architected"
    control: "SEC 06 — How do you protect your compute resources?"

references:
  - "https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html"
  - "https://docs.aws.amazon.com/inspector/latest/user/scanning-ecr.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/ecr-private-image-scanning-enabled.html"
