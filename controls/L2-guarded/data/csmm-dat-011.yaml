id: "csmm-dat-011"
name: "S3 Versioning Enabled"
level: 2
pillar: "data"
priority: "high"
severity_weight: 3

description: >
  All S3 buckets must have versioning status Enabled. Buckets with status
  Suspended fail regardless of history. Buckets tagged Classification=Audit
  or Classification=Backup must additionally have Object Lock enabled.

risk: >
  Without versioning, a single accidental or malicious s3:DeleteObject or
  s3:PutObject call permanently and irreversibly overwrites or destroys data
  with no recovery path. Ransomware attacks targeting S3 buckets exploit the
  absence of versioning to encrypt or delete all objects and then demand payment
  for recovery, leaving organizations with no alternative but to pay or accept
  permanent data loss.

verification:
  - "Run aws s3api get-bucket-versioning --bucket <bucket-name> for all buckets in scope and confirm Status is Enabled, not Suspended or absent."
  - "Use AWS Config rule s3-bucket-versioning-enabled and verify it is compliant across all target accounts and regions."
  - "For audit log and backup buckets, verify aws s3api get-object-lock-configuration returns an active default retention rule."
  - "Confirm an S3 Lifecycle policy is configured to transition or expire non-current versions on a schedule to control storage costs."

compliance:
  - framework: "CIS AWS Foundations"
    control: "2.1.3"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "CP-9"

references:
  - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html"
  - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-versioning-enabled.html"
