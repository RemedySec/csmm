id: "csmm-dat-013"
name: "DynamoDB Point-in-Time Recovery"
level: 2
pillar: "data"
priority: "high"
severity_weight: 3

description: >
  Point-in-Time Recovery (PITR) must be enabled on all DynamoDB tables that
  store production, compliance-relevant, or business-critical data. PITR
  provides a continuous backup window of up to 35 days, allowing restoration
  of the table to any second within that window without requiring manual
  snapshot management.

risk: >
  Without PITR, corruption of a DynamoDB table — whether caused by an
  application bug that overwrites records, a bulk delete operation targeting
  the wrong table, or a ransomware actor with write access — requires manual
  reconstruction of the table from application-level event logs or message
  queues, which is time-consuming, error-prone, and frequently incomplete.
  For tables that serve real-time transactional workloads, even partial data
  loss can cause cascading application failures and customer-visible outages.

verification:
  - "Run aws dynamodb describe-continuous-backups --table-name <table-name> for all tables and confirm PointInTimeRecoveryStatus is ENABLED."
  - "Use AWS Config rule dynamodb-pitr-enabled and verify it is compliant in all target accounts and regions."
  - "Confirm the table list is comprehensive by cross-referencing with infrastructure-as-code definitions and the account's table inventory."
  - "Periodically test recovery by restoring a table to a specific point in time in a non-production account and validating data integrity."

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "CP-9"

references:
  - "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/dynamodb-pitr-enabled.html"
  - "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/backuprestore_HowItWorks.html"
