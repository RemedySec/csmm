id: "csmm-gov-002"
name: "CloudTrail Log File Validation"
level: 2
pillar: "iam"
priority: "high"
severity_weight: 3

description: >
  CloudTrail log file validation must be enabled on all trails by setting
  EnableLogFileValidation to true. This causes CloudTrail to create a SHA-256
  digest file for each log delivery and sign it with a private key, enabling
  detection of any log file modification, deletion, or insertion after delivery
  to S3. Digest files must be stored and verified as part of routine compliance
  and incident response procedures.

risk: >
  An attacker with write access to the CloudTrail S3 bucket can modify or
  delete log files to cover their tracks or to undermine forensic investigations.
  Without log file validation, there is no cryptographic mechanism to distinguish
  authentic log records from tampered ones, meaning that all audit evidence
  produced by CloudTrail becomes legally and forensically suspect. This
  undermines the evidentiary value of logs for regulatory compliance, litigation,
  and internal investigations.

verification:
  - "Run aws cloudtrail describe-trails and confirm LogFileValidationEnabled is true for all trails."
  - "Deploy AWS Config rule cloud-trail-log-file-validation-enabled and verify compliance across all accounts."
  - "Confirm digest files are present in the S3 bucket under the CloudTrail/digest/ prefix alongside log deliveries."
  - "Periodically run aws cloudtrail validate-logs --trail-arn <arn> --start-time <time> to verify digest chain integrity as part of compliance checks."

compliance:
  - framework: "CIS AWS Foundations"
    control: "3.2"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AU-9"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html"
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-cli.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/cloud-trail-log-file-validation-enabled.html"
