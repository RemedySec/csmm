id: "csmm-iam-018"
name: "OIDC Federated Role Trust Policies Scoped to Specific Subjects"
level: 2
pillar: "iam"
priority: "critical"
severity_weight: 4

description: >
  Every IAM role whose trust policy references an OIDC provider (e.g.
  token.actions.githubusercontent.com, gitlab.com, or any custom IdP) must include
  a Condition that scopes the sub claim to a specific identity — a specific repository,
  branch, environment, or service account. Trust policies with a missing sub condition
  or a wildcard sub condition ("*") must be remediated immediately by adding a
  restrictive StringEquals or StringLike condition on the sub claim.

  If no OIDC providers are configured in the account, this control is N/A.

risk: >
  An OIDC-federated role with no sub condition or sub: "*" is effectively public to
  any identity that can obtain a token from that OIDC provider. For GitHub Actions
  this means any workflow in any repository across all of GitHub can assume the role —
  not just your own repositories. An attacker who controls any public GitHub repository
  can exploit this to assume the role and access your AWS account with no credentials
  to steal. This is among the fastest-growing attack vectors in cloud environments as
  OIDC federation for CI/CD has become standard practice.

verification:
  - "Run: aws iam list-open-id-connect-providers — if empty, control is N/A."
  - "For each OIDC provider, find trusting roles: aws iam list-roles | jq '[.Roles[] | select(.AssumeRolePolicyDocument.Statement[].Principal.Federated != null) | select(.AssumeRolePolicyDocument.Statement[].Principal.Federated | contains(\"oidc\")) | .RoleName]'"
  - "For each OIDC-trusting role: aws iam get-role --role-name <name> | jq '.Role.AssumeRolePolicyDocument.Statement[] | select(.Principal.Federated != null) | .Condition' — confirm a StringEquals or StringLike condition on the sub claim is present and does not contain '*' as the sole value."
  - "For GitHub Actions specifically, confirm sub condition scopes to a specific repo pattern e.g. 'repo:myorg/myrepo:*' not '*'."

compliance:
  - framework: "CIS AWS Foundations"
    control: "N/A"
  - framework: "SOC2"
    control: "CC6.3"
  - framework: "NIST 800-53"
    control: "IA-8"
  - framework: "AWS Well-Architected"
    control: "SEC 02 — How do you manage authentication for people and machines?"

references:
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html"
  - "https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html"
  - "https://docs.gitlab.com/ee/ci/cloud_services/aws/"
