id: "csmm-mon-010"
name: "CloudWatch Alarm for Console Sign-In Without MFA"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect console sign-in events where
  MFA was not used, by filtering CloudTrail ConsoleLogin events where
  additionalEventData.MFAUsed is No. Console access without second-factor
  authentication must trigger immediate SNS alerting to the security team.

risk: >
  Console access without MFA indicates either a policy gap where a user account
  is exempted from MFA enforcement, or a compromised session token used to bypass
  the MFA requirement entirely. Either case requires immediate investigation, as
  console access provides a broad attack surface including the ability to modify
  security controls.

verification:
  - "Verify the metric filter pattern filters on eventName = ConsoleLogin and additionalEventData.MFAUsed = No: aws logs describe-metric-filters --log-group-name <trail-log-group>"
  - "Confirm the alarm threshold is >= 1 with an evaluation period of 300 seconds or less"
  - "Verify an SNS action is attached with confirmed, actively monitored subscriptions"
  - "Cross-check with IAM credential report to identify accounts without MFA: aws iam generate-credential-report && aws iam get-credential-report"
  - "Verify the SCP or IAM permission boundary enforcing MFA is in place: check for aws:MultiFactorAuthPresent condition in applicable policies"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.2"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "IA-2"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-2"
