id: "csmm-mon-009"
name: "CloudWatch Alarm for Organizations Changes"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect AWS Organizations structure
  changes, including InviteAccountToOrganization, LeaveOrganization,
  RemoveAccountFromOrganization, CreatePolicy, DeletePolicy, UpdatePolicy,
  AttachPolicy, and DetachPolicy events. Organization structure modifications
  must trigger SNS notification to the security and cloud governance teams.

risk: >
  Unauthorized Organizations changes can remove accounts from governance controls,
  disable or weaken Service Control Policies, or invite rogue accounts that bypass
  existing security baselines. Changes to SCPs can silently nullify all preventive
  controls enforced at the organization level, affecting every account simultaneously.

verification:
  - "Confirm the CloudTrail trail capturing Organizations events is a management-level trail enabled in the management account: aws cloudtrail describe-trails --include-shadow-trails"
  - "Verify the metric filter covers InviteAccountToOrganization, LeaveOrganization, CreatePolicy, and DetachPolicy events"
  - "Confirm the alarm threshold is >= 1 with an evaluation period of 300 seconds or less"
  - "Verify an SNS action is attached with confirmed subscriptions to a monitored security channel"
  - "Review current SCPs: aws organizations list-policies --filter SERVICE_CONTROL_POLICY and confirm expected policies are attached to root or target OUs"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.15"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "CM-3"

references:
  - "https://docs.aws.amazon.com/organizations/latest/userguide/orgs_security_incident-response.html"
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-15"
