id: "csmm-mon-008"
name: "CloudWatch Alarm for VPC Changes"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect VPC-level changes, including
  CreateVpc, DeleteVpc, ModifyVpcAttribute, AcceptVpcPeeringConnection,
  CreateVpcPeeringConnection, and DeleteVpcPeeringConnection events. Network
  topology changes must be tracked in real time to maintain an accurate picture
  of the account's network boundary.

risk: >
  Unauthorized VPC changes can create unexpected network paths, bypass intended
  segmentation, or establish cross-account connectivity without approval.
  Undetected VPC peering connections in particular can allow lateral movement
  between environments that were designed to be isolated from one another.

verification:
  - "Verify the metric filter covers CreateVpc, DeleteVpc, ModifyVpcAttribute, and AcceptVpcPeeringConnection: aws logs describe-metric-filters --log-group-name <trail-log-group>"
  - "Confirm the alarm threshold is >= 1 with an evaluation period of 300 seconds or less"
  - "Verify an SNS action is attached with confirmed subscriptions"
  - "Review active VPC peering connections: aws ec2 describe-vpc-peering-connections --query 'VpcPeeringConnections[?Status.Code==`active`]'"
  - "Cross-check with AWS Config rule vpc-default-security-group-closed and vpc-flow-logs-enabled"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.14"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "CM-3"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-peering.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-14"
