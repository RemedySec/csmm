id: "csmm-mon-011"
name: "CloudWatch Alarm for Console Authentication Failures"
level: 2
pillar: "monitoring"
priority: "medium"
severity_weight: 2

description: >
  A CloudWatch metric filter and alarm must detect repeated console authentication
  failures by filtering CloudTrail ConsoleLogin events where responseElements.ConsoleLogin
  is Failure. Multiple failed sign-in attempts within a short window may indicate
  brute-force or credential-stuffing attacks targeting IAM users.

risk: >
  Without monitoring for authentication failures, brute-force or credential-stuffing
  attacks against the AWS Management Console can run indefinitely without triggering
  any alert. IAM does not natively lock accounts after failed attempts, so attackers
  have unlimited time to attempt password guessing against accounts not protected by MFA.

verification:
  - "Verify the metric filter pattern filters on eventName = ConsoleLogin and responseElements.ConsoleLogin = Failure: aws logs describe-metric-filters --log-group-name <trail-log-group>"
  - "Confirm the alarm threshold is set to a value appropriate for the organization (commonly >= 3 within a 5-minute period)"
  - "Verify an SNS action is attached with confirmed subscriptions"
  - "Review recent failed logins: aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=ConsoleLogin and filter for Failure responses"
  - "Cross-check with IAM Access Analyzer and GuardDuty IAMUser/AnomalousBehavior findings for correlated alerts"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.6"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AC-7"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-6"
