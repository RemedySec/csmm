id: "csmm-mon-005"
name: "CloudTrail Integrated with CloudWatch Logs"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  All CloudTrail trails must be configured to deliver log events to a CloudWatch
  Logs log group in real time. The CloudWatchLogsLogGroupArn and
  CloudWatchLogsRoleArn fields must be set on every trail, and the log group
  must have received events within the last 24 hours. This integration is the
  prerequisite for all CloudWatch metric filter-based alarms — without it,
  CloudTrail events are only available in S3 with significant delivery delay
  and no real-time alerting capability.

risk: >
  CloudTrail writing only to S3 provides forensic evidence after the fact but
  no real-time detection. An attacker who compromises credentials and begins
  making API calls will not trigger any CloudWatch alarms unless the trail is
  actively streaming to CloudWatch Logs. The gap between an event occurring
  and a human reviewing S3 logs is typically hours to days — more than enough
  time to establish persistence, exfiltrate data, and cover tracks.

verification:
  - "Run: aws cloudtrail describe-trails | jq '.trailList[] | {Name, CloudWatchLogsLogGroupArn, CloudWatchLogsRoleArn}' — confirm both fields are non-null for all trails."
  - "Run: aws cloudtrail get-trail-status --name <trail-arn> | jq '{LatestCloudWatchLogsDeliveryTime, LatestCloudWatchLogsDeliveryError}' — confirm delivery time is within the last 24 hours and no delivery error exists."
  - "AWS Config rule: cloud-trail-cloud-watch-logs-enabled — deploy and confirm compliant."

compliance:
  - framework: "CIS AWS Foundations"
    control: "3.4"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AU-6"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/cloud-trail-cloud-watch-logs-enabled.html"
