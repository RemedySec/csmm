id: "csmm-mon-005"
name: "CloudWatch Alarm for CloudTrail Configuration Changes"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect changes to CloudTrail
  configuration, including StopLogging, DeleteTrail, UpdateTrail, and
  CreateTrail events. Audit trail tampering must trigger immediate SNS
  alerting to prevent blind spots in the security audit record.

risk: >
  Disabling or modifying CloudTrail is a common attacker action to cover tracks
  after initial access. Delayed detection of trail configuration changes allows
  extended periods of unmonitored activity, making forensic investigation of
  the full breach timeline impossible and potentially invalidating compliance
  audit evidence.

verification:
  - "Verify the metric filter pattern includes StopLogging, DeleteTrail, and UpdateTrail: aws logs describe-metric-filters --log-group-name <trail-log-group>"
  - "Confirm the alarm has a period of 300 seconds or less and threshold >= 1"
  - "Verify an SNS action is attached with a confirmed subscription delivering to an actively monitored endpoint"
  - "Confirm CloudTrail itself has log file validation enabled: aws cloudtrail describe-trails --query 'trailList[].LogFileValidationEnabled'"
  - "Test by attempting to stop logging (in a non-production account) and verify the alarm fires within one evaluation period"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.5"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AU-6"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-5"
