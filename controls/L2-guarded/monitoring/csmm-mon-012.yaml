id: "csmm-mon-012"
name: "CloudWatch Alarm for CMK Disable or Scheduled Deletion"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect KMS customer-managed key
  lifecycle events, including DisableKey and ScheduleKeyDeletion. Key disabling
  or deletion scheduling must trigger immediate SNS notification, as these
  actions directly threaten the availability of all data encrypted under
  the affected keys.

risk: >
  Disabling or scheduling deletion of encryption keys renders all data encrypted
  under those keys permanently inaccessible once the deletion period lapses.
  Attackers may disable CMKs as part of a ransomware or data-destruction attack,
  creating an availability incident that is difficult or impossible to recover
  from without the original key material.

verification:
  - "Verify the metric filter pattern covers DisableKey and ScheduleKeyDeletion: aws logs describe-metric-filters --log-group-name <trail-log-group>"
  - "Confirm the alarm threshold is >= 1 with an evaluation period of 300 seconds or less"
  - "Verify an SNS action is attached with confirmed subscriptions to an immediately monitored channel (e.g., PagerDuty, on-call rotation)"
  - "Review all KMS keys with pending deletion: aws kms list-keys and aws kms describe-key for each, checking KeyState = PendingDeletion"
  - "Verify key deletion guard rails: confirm key administrators do not have kms:ScheduleKeyDeletion unless explicitly required"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.7"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "SC-12"

references:
  - "https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html"
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-7"
