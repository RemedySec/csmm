id: "csmm-mon-004"
name: "CloudWatch Alarm for IAM Policy Changes"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect changes to IAM policies,
  including CreatePolicy, DeletePolicy, CreatePolicyVersion, DeletePolicyVersion,
  SetDefaultPolicyVersion, AttachUserPolicy, DetachUserPolicy, AttachRolePolicy,
  DetachRolePolicy, AttachGroupPolicy, and DetachGroupPolicy events. All policy
  modifications must trigger SNS notification.

risk: >
  Unauthorized IAM policy changes can grant attackers persistent access or
  escalate privileges in ways that survive credential rotation. Without real-time
  alerting, policy backdoors can be introduced during a breach and remain active
  long after the initial intrusion vector is closed, enabling continued access.

verification:
  - "Verify the metric filter covers all relevant IAM policy actions: aws logs describe-metric-filters and inspect the filter pattern for CreatePolicy, DeletePolicy, AttachUserPolicy, DetachRolePolicy variants"
  - "Confirm the alarm threshold is set to >= 1 with a period of 300 seconds or less"
  - "Verify SNS action is attached and the topic subscription is confirmed"
  - "Cross-check against AWS Config rule iam-policy-no-statements-with-admin-access for complementary coverage"
  - "Review recent IAM policy changes: aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=CreatePolicy"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.4"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AC-2(4)"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-4"
