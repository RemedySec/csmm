id: "csmm-mon-006"
name: "CloudWatch Alarm for S3 Bucket Policy Changes"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must detect changes to S3 bucket access
  controls, including PutBucketPolicy, DeleteBucketPolicy, PutBucketAcl,
  PutBucketCors, and PutBucketPublicAccessBlock events. Bucket access
  modifications must trigger SNS notification to enable rapid response before
  data exposure occurs.

risk: >
  S3 bucket policy changes can expose private data to the public internet within
  seconds of being applied. Detecting these changes in real time allows the
  security team to revert inadvertent or malicious public access configurations
  before they are discovered and exploited by external actors or crawlers.

verification:
  - "Verify the metric filter covers PutBucketPolicy, DeleteBucketPolicy, and PutBucketAcl events: aws logs describe-metric-filters --log-group-name <trail-log-group>"
  - "Confirm S3 data events are enabled in CloudTrail if bucket-level API calls are required: aws cloudtrail get-event-selectors --trail-name <trail-name>"
  - "Confirm the alarm threshold is >= 1 with an evaluation period of 300 seconds or less"
  - "Verify the SNS topic has confirmed subscriptions and delivers alerts to an actively monitored channel"
  - "Cross-check with AWS Config rule s3-bucket-public-read-prohibited and s3-bucket-public-write-prohibited for complementary coverage"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.8"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AU-12"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-overview.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-8"
