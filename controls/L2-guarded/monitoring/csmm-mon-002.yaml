id: "csmm-mon-002"
name: "CloudWatch Alarm for Unauthorized API Calls"
level: 2
pillar: "monitoring"
priority: "high"
severity_weight: 3

description: >
  A CloudWatch metric filter and alarm must be configured to detect unauthorized
  API calls by filtering CloudTrail logs for AccessDenied and UnauthorizedAccess
  error codes. An SNS topic must be configured as the alarm action to ensure
  timely notification to the security team.

risk: >
  Unauthorized API call patterns are early indicators of credential compromise
  or privilege escalation attempts. Without alerting, an attacker systematically
  probing IAM permissions can enumerate the account's authorization boundaries
  undetected, refining their attack before a successful exploitation.

verification:
  - "Confirm a CloudTrail trail is logging to CloudWatch Logs: aws cloudtrail describe-trails --query 'trailList[].CloudWatchLogsLogGroupArn'"
  - "Verify the metric filter exists: aws logs describe-metric-filters --log-group-name <trail-log-group> and check for filter pattern containing errorCode = AccessDenied or UnauthorizedAccess"
  - "Confirm the alarm threshold is set to >= 1: aws cloudwatch describe-alarms --alarm-names <alarm-name> --query 'MetricAlarms[].Threshold'"
  - "Verify an SNS topic action is attached to the alarm and the topic has at least one confirmed subscription"
  - "Test by making a deliberate unauthorized API call and confirming the alarm transitions to ALARM state within the evaluation period"

compliance:
  - framework: "CIS AWS Foundations"
    control: "4.1"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "SI-4"

references:
  - "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html"
  - "https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudwatch-controls.html#cloudwatch-1"
