id: "csmm-str-010"
name: "RDS Automated Backups Enabled"
level: 2
pillar: "storage"
priority: "high"
severity_weight: 3

description: >
  All RDS DB instances and Aurora clusters must have automated backups enabled
  with a backup retention period of at least 7 days (14 days recommended for
  production workloads). The backup window must be configured to avoid peak
  traffic hours, and the BackupRetentionPeriod must not be set to 0, which
  disables automated backups entirely.

risk: >
  Disabling automated backups or setting retention to zero eliminates the only
  AWS-native recovery path for database failures, ransomware attacks, and
  accidental data deletion. A ransomware actor who gains access to RDS
  credentials and drops tables, or an operator who runs a destructive migration
  script against the wrong environment, leaves the organization with no recovery
  option other than a manual rebuild from application logs — a process that
  can take days and may be incomplete.

verification:
  - "Run aws rds describe-db-instances and aws rds describe-db-clusters across all regions and flag any instance where BackupRetentionPeriod is 0."
  - "Confirm BackupRetentionPeriod is 7 or greater for all non-dev instances and 14 or greater for production-tagged instances."
  - "Use AWS Config rule db-instance-backup-enabled and verify compliance in all target accounts."
  - "Verify that the automated backup window does not overlap with the maintenance window to prevent backup failures during patching."

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "CP-9"

references:
  - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/db-instance-backup-enabled.html"
  - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_BestPractices.html"
