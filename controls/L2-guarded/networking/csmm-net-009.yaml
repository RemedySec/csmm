id: "csmm-net-009"
name: "Enable VPC Flow Logs"
level: 2
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  VPC Flow Logs must be enabled on all VPCs and configured to capture ACCEPT
  and REJECT traffic, with log data delivered to CloudWatch Logs or S3 with
  a retention policy of at least 90 days. Flow logs must use log format version 5 with fields: srcaddr, dstaddr, srcport, dstport, protocol, tcp-flags, type, pkt-srcaddr, pkt-dstaddr
  for richer forensic analysis.

risk: >
  Without VPC Flow Logs, security teams have no visibility into which IP
  addresses are communicating with instances, making network-based anomaly
  detection, lateral movement tracing, and forensic reconstruction impossible
  after an incident. Regulatory frameworks including PCI DSS and HIPAA
  explicitly require network traffic logging, and gaps in this data can result
  in audit failures and inability to demonstrate breach scope during assessments.

verification:
  - "Run aws ec2 describe-flow-logs --filter Name=resource-type,Values=VPC for each region and confirm every VPC ID has at least one active flow log."
  - "Confirm the flow log TrafficType is ALL (not ACCEPT or REJECT only) and the LogFormat includes enhanced metadata fields."
  - "Verify the destination (CloudWatch Logs group or S3 bucket) has a retention policy of at least 90 days and appropriate access controls."
  - "Check that AWS Config rule vpc-flow-logs-enabled is deployed and compliant in all in-scope regions."

compliance:
  - framework: "CIS AWS Foundations"
    control: "3.9"
    version: "3.0"
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "AU-12"

references:
  - "https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-cwl.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/vpc-flow-logs-enabled.html"
