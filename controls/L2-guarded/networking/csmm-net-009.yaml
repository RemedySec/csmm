id: "csmm-net-009"
name: "NACL Deny Known Bad Ports"
level: 2
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  Network ACLs must include explicit DENY rules for inbound and outbound
  traffic on ports associated with inherently insecure or legacy protocols,
  including Telnet (23), FTP control (21) and data (20), RSH/RExec (514/512),
  TFTP (69), SNMP (161/162), and SMB (445/139). These rules must be placed
  with rule numbers lower than any permissive ALLOW rules to ensure they
  take precedence.

risk: >
  Ports associated with legacy protocols are actively and continuously scanned
  by automated threat actors across the internet. Services accidentally exposed
  on these ports — whether misconfigured applications or default AWS service
  behaviors — can be exploited without authentication or via well-known
  vulnerabilities. NACL-level blocking provides a defense-in-depth layer that
  operates independently of security group configuration errors.

verification:
  - "For each VPC subnet, run aws ec2 describe-network-acls and inspect inbound and outbound rules for explicit DENY entries on ports 20, 21, 23, 69, 139, 161, 162, 445, 512, 514."
  - "Confirm the DENY rules have lower rule numbers than any ALLOW rules covering the same port range."
  - "Use AWS Config or a custom Lambda to enumerate all NACLs across all regions and flag any missing port denials."
  - "Validate that the rules apply to both TCP and UDP where applicable (e.g., SNMP uses UDP 161/162, TFTP uses UDP 69)."

compliance:
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"

references:
  - "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-recommended-nacl-rules.html"
