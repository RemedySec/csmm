id: "csmm-gov-004"
name: "GuardDuty Enabled"
level: 2
pillar: "networking"
priority: "critical"
severity_weight: 4

description: >
  Amazon GuardDuty must be enabled in every AWS region in every member account,
  with the organization management account configured as the GuardDuty
  delegated administrator so that new member accounts are automatically enrolled.
  GuardDuty findings must be aggregated to a central security account, and
  findings with severity >= 7.0 must trigger an EventBridge rule that publishes to SNS within 5 minutes of finding creation.

risk: >
  Without GuardDuty, there is no automated, ML-driven analysis of CloudTrail
  API logs, VPC Flow Logs, and DNS logs for indicators of compromise such as
  reconnaissance activity, credential exfiltration, cryptocurrency mining,
  communication with known malicious IPs, and anomalous API call patterns.
  Human review of raw logs at scale is impractical, meaning that ongoing
  attacker activity — including lateral movement, data staging, and persistent
  access establishment — can continue undetected for weeks or months until
  discovered through external notification or manual audit.

verification:
  - "Run aws guardduty list-detectors in each region for every account and confirm at least one detector exists with Status: ENABLED."
  - "In the organization management or security tooling account, confirm aws guardduty list-members returns all expected member accounts as active."
  - "Verify auto-enable is configured for new accounts: aws guardduty describe-organization-configuration should show AutoEnable: true."
  - "Confirm an EventBridge rule is in place to route GuardDuty HIGH and CRITICAL severity findings to an SNS topic with an active subscription."
  - "Test by running: aws guardduty create-sample-findings. Verify the EventBridge rule fires and SNS notification is delivered within 5 minutes."

compliance:
  - framework: "SOC2"
    control: "CC7.2"
  - framework: "NIST 800-53"
    control: "SI-4"

references:
  - "https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"
  - "https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html"
  - "https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings_cloudwatch.html"
