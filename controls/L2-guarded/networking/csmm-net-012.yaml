id: "csmm-net-012"
name: "NACL No Unrestricted Ingress"
level: 2
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  Network ACL inbound rules must not permit unrestricted ingress from all
  sources (0.0.0.0/0 or ::/0) on all ports. Inbound rules must specify the
  minimum necessary source CIDR ranges and port numbers for each subnet's
  workload purpose. Public subnets may allow inbound 80/443 from any source,
  but must explicitly deny all other ports from 0.0.0.0/0.

risk: >
  Unrestricted inbound access exposes every port on every instance in the
  subnet directly to the public internet, regardless of security group
  configuration on individual instances. A single security group misconfiguration
  or an instance launched without the correct security group becomes immediately
  and fully internet-accessible, providing attackers a direct path to exploit
  any service, vulnerability, or default credential present on the instance.

verification:
  - "Run aws ec2 describe-network-acls across all regions and flag ALLOW rules where CidrBlock is 0.0.0.0/0 or Ipv6CidrBlock is ::/0 and PortRange covers more than the approved public ports (80, 443)."
  - "Confirm private and database subnet NACLs have no inbound rules permitting traffic from 0.0.0.0/0 on any port."
  - "Validate that ephemeral port ranges (1024-65535) are allowed from appropriate sources (load balancer subnets) rather than from 0.0.0.0/0."
  - "Deploy the AWS Config rule restricted-common-ports and verify it is compliant across all accounts and regions."

compliance:
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"

references:
  - "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/restricted-common-ports.html"
