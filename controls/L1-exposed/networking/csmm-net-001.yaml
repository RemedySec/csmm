id: "csmm-net-001"
name: "No Security Group Allows Unrestricted Inbound Access from Internet"
level: 1
pillar: "networking"
priority: "critical"
severity_weight: 4

description: >
  No security group inbound rule may allow unrestricted access from 0.0.0.0/0
  or ::/0 on any of the following: SSH (port 22), RDP (port 3389), or all ports
  (protocol -1 or port range 0-65535). These represent the highest-risk exposure
  patterns — administrative ports open to the entire internet, or a complete
  absence of port-level filtering. All such rules must be removed and replaced
  with rules scoped to specific known CIDRs, a bastion host security group, or
  removed entirely in favor of AWS Systems Manager Session Manager for
  administrative access.

risk: >
  Security groups with unrestricted inbound access on administrative ports or all
  ports are among the most exploited misconfigurations in AWS. SSH and RDP exposed
  to the internet are continuously scanned and brute-forced by automated tooling
  within minutes of creation. A security group allowing all traffic from the internet
  is functionally equivalent to no firewall — every port on associated instances is
  reachable globally, exposing internal APIs, debug endpoints, and database ports
  to trivial exploitation. These are consistently the highest-frequency critical
  findings in cloud security assessments.

verification:
  - 'SSH: aws ec2 describe-security-groups --query "SecurityGroups[?IpPermissions[?((FromPort==`22`) && IpRanges[?CidrIp==`0.0.0.0/0`])]].GroupId" — expect empty.'
  - 'RDP: same query with FromPort==`3389` — expect empty.'
  - 'All ports: aws ec2 describe-security-groups --query "SecurityGroups[?IpPermissions[?IpProtocol==`-1` && IpRanges[?CidrIp==`0.0.0.0/0`]]].GroupId" — expect empty.'
  - 'Repeat all three checks for IPv6: replace IpRanges[?CidrIp==''0.0.0.0/0''] with Ipv6Ranges[?CidrIpv6==''::/0''].'
  - 'AWS Config rules: restricted-ssh, restricted-common-ports — deploy in all regions and confirm zero non-compliant resources.'

compliance:
  - framework: "CIS AWS Foundations"
    control: "5.2"
    version: "3.0"
  - framework: "CIS AWS Foundations"
    control: "5.3"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"
  - framework: "AWS Well-Architected"
    control: "SEC 06 — How do you protect your network resources?"

references:
  - "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/restricted-ssh.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/restricted-common-ports.html"
  - "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"
