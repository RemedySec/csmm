id: "csmm-net-007"
name: "Default VPC Not in Use or Deleted in All Regions"
level: 1
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  The AWS default VPC exists in every region by default and comes pre-configured
  with an internet gateway, public subnets in every availability zone, and a default
  security group that allows all outbound traffic. No production or sensitive workloads
  may run in the default VPC. The preferred state is deletion of the default VPC in
  every region; where deletion is not operationally feasible, the default VPC must
  have no running instances, no attached internet gateway in active use, and the
  default security group must restrict all traffic.

risk: >
  Resources inadvertently launched into the default VPC inherit its permissive
  defaults — public subnets with auto-assigned public IPs, a wide-open default
  security group, and a pre-attached internet gateway. Developers and automated
  tools frequently use the default VPC as a convenience during testing and
  prototyping, and those workloads sometimes persist into production without the
  deliberate network architecture that a purpose-built VPC provides. The default
  VPC's configuration is also frequently overlooked in security reviews because
  teams focus on their named VPCs.

verification:
  - "For each region: aws ec2 describe-vpcs --filters Name=isDefault,Values=true | jq '.Vpcs[].VpcId' — if no output, default VPC is deleted (pass)."
  - "If default VPC exists: aws ec2 describe-instances --filters Name=vpc-id,Values=<default-vpc-id> | jq '.Reservations[].Instances[].InstanceId' — expect empty."
  - "Confirm default security group in default VPC has no inbound rules: aws ec2 describe-security-groups --filters Name=vpc-id,Values=<id> Name=group-name,Values=default | jq '.SecurityGroups[].IpPermissions' — expect empty array."
  - "AWS Config rule: vpc-default-security-group-closed — deploy in all regions."

compliance:
  - framework: "CIS AWS Foundations"
    control: "5.4"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"
  - framework: "AWS Well-Architected"
    control: "SEC 06 — How do you protect your network resources?"

references:
  - "https://docs.aws.amazon.com/vpc/latest/userguide/default-vpc.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/vpc-default-security-group-closed.html"
