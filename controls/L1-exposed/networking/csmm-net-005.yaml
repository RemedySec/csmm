id: "csmm-net-005"
name: "CloudFront Enforce HTTPS"
level: 1
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  All CloudFront distributions must be configured with a viewer protocol policy of
  'redirect-to-https' or 'https-only' for all cache behaviors. The distribution must use
  a custom SSL/TLS certificate (ACM) rather than the CloudFront default certificate when
  serving traffic on a custom domain. The minimum protocol version for viewer connections
  must be TLSv1.2_2021 or newer. Enforce using the AWS Config rule
  'cloudfront-viewer-policy-https'.

risk: >
  CloudFront distributions that allow HTTP viewer connections permit man-in-the-middle
  (MITM) attacks where an attacker on the client's network intercepts and modifies traffic
  before it reaches the CloudFront edge. This is especially critical for CloudFront
  distributions serving web applications with login forms, API endpoints, or authenticated
  content, as credentials and session tokens can be captured in transit. HTTP also enables
  SSL stripping attacks that silently downgrade HTTPS sessions to HTTP without user awareness.

verification:
  - "Run: aws cloudfront list-distributions | jq '.DistributionList.Items[] | {Id: .Id, Behaviors: [.DefaultCacheBehavior.ViewerProtocolPolicy, .CacheBehaviors.Items[].ViewerProtocolPolicy]}' — all values must be 'redirect-to-https' or 'https-only', never 'allow-all'."
  - "Confirm AWS Config rule 'cloudfront-viewer-policy-https' is ENABLED and reports COMPLIANT."
  - "For each distribution, verify MinimumProtocolVersion is TLSv1.2_2021 under the viewer certificate configuration."
  - "Use curl -v http://<cloudfront-domain> and confirm a 301 or 302 redirect to https:// is returned."
  - "Verify ACM certificates for custom domains are in us-east-1 (required for CloudFront) and are not expired."

compliance:
  - framework: "SOC2"
    control: "CC6.7"
  - framework: "NIST 800-53"
    control: "SC-8"
  - framework: "AWS Well-Architected"
    control: "SEC 08 — How do you protect your data in transit?"

references:
  - "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https.html"
  - "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-viewer-protocols-ciphers.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/cloudfront-viewer-policy-https.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudfront-controls.html#cloudfront-3"
