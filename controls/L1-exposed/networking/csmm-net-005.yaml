id: "csmm-net-005"
name: "ALB/NLB HTTPS Only"
level: 1
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  All Application Load Balancers (ALBs) and Network Load Balancers (NLBs) must accept
  traffic exclusively over HTTPS/TLS. HTTP listeners on port 80 must either be absent or
  configured with a redirect rule (HTTP 301) to HTTPS — they must not forward traffic
  directly to backend targets. ALBs must use an ACM-managed TLS certificate. Enforce using
  AWS Config rule 'alb-http-to-https-redirection-check' and Security Hub control
  ELBv2.1.

risk: >
  Unencrypted HTTP traffic transmits authentication headers, session tokens, API keys, and
  user data in plaintext. Any network-layer observer on the path between the client and the
  load balancer — including ISPs, shared Wi-Fi networks, or a compromised intermediate hop —
  can passively capture this data. In multi-tenant or shared-infrastructure environments,
  unencrypted inter-service traffic is also visible to other tenants via packet capture on
  shared network segments.

verification:
  - "Run: aws elbv2 describe-listeners --load-balancer-arn <arn> and verify no listener with Protocol: HTTP has a DefaultActions type of 'forward' — only 'redirect' with StatusCode 301 or 302 is permitted."
  - "Confirm AWS Config rule 'alb-http-to-https-redirection-check' is ENABLED and reports COMPLIANT."
  - "Use curl -v http://<alb-dns> and verify a 301 redirect to https:// is returned rather than a 200 response."
  - "Verify all ACM certificates attached to ALB listeners are valid, not expired, and auto-renewal is enabled (Domain Validation or DNS validation)."
  - "For NLBs with TLS listeners, confirm the TLS policy is TLS-1-2-2017-01 or newer (see csmm-net-007)."

compliance:
  - framework: "SOC2"
    control: "CC6.7"
  - framework: "NIST 800-53"
    control: "SC-8"
  - framework: "AWS Well-Architected"
    control: "SEC 08 — How do you protect your data in transit?"

references:
  - "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html"
  - "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html#redirect-actions"
  - "https://docs.aws.amazon.com/config/latest/developerguide/alb-http-to-https-redirection-check.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/elb-controls.html#elb-1"
