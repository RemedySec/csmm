id: "csmm-net-003"
name: "Restrict Default Security Group to No Traffic"
level: 1
pillar: "networking"
priority: "high"
severity_weight: 3

description: >
  The default security group in every VPC must have all inbound and outbound rules removed
  so that it permits no traffic. No EC2 instance, RDS instance, Lambda function, or other
  resource should use the default security group — all resources must be assigned explicitly
  created security groups with documented, least-privilege rules. Use the AWS Config rule
  'vpc-default-security-group-closed' to enforce this requirement across all regions.

risk: >
  The AWS default security group allows all inbound and outbound traffic between resources
  that share the same default security group. This creates an implicit full-mesh trust
  relationship across all resources in a VPC that were deployed without an explicit security
  group assignment — a common occurrence in developer accounts or when infrastructure-as-code
  templates omit security group parameters. Restricting the default security group eliminates
  this hidden lateral movement path and forces engineers to explicitly define network trust.

verification:
  - "Run: aws ec2 describe-security-groups --filters Name=group-name,Values=default | jq '.SecurityGroups[] | {VpcId: .VpcId, IngressRules: .IpPermissions, EgressRules: .IpPermissionsEgress}' — both IngressRules and EgressRules must be empty arrays for all VPCs."
  - "Confirm AWS Config rule 'vpc-default-security-group-closed' is ENABLED and reports COMPLIANT across all regions."
  - "Run: aws ec2 describe-instances | jq '[.Reservations[].Instances[].SecurityGroups[] | select(.GroupName == \"default\")] | length' — expected 0 (no instances using default SG)."
  - "Verify Terraform/CloudFormation templates enforce explicit security group IDs on all resource definitions and fail linting if 'default' SG is referenced."

compliance:
  - framework: "CIS AWS Foundations"
    control: "5.4"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7(5)"
  - framework: "AWS Well-Architected"
    control: "SEC 05 — How do you protect your network resources?"

references:
  - "https://docs.aws.amazon.com/config/latest/developerguide/vpc-default-security-group-closed.html"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/default-vpc.html#default-security-group"
  - "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/ec2-controls.html#ec2-2"
