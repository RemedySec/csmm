id: "csmm-cmp-004"
name: "EKS Private API Endpoint"
level: 1
pillar: "compute"
priority: "high"
severity_weight: 3

description: >
  All EKS cluster API server endpoints must have the public endpoint disabled and
  the private endpoint enabled, ensuring that kubectl and other Kubernetes API
  clients can only reach the control plane from within the cluster's VPC or via
  an authorized VPN or Direct Connect connection. Public endpoint access must be
  set to false in the cluster's resource configuration.

risk: >
  A public EKS API endpoint exposes the Kubernetes control plane to the internet,
  making it a target for credential brute-forcing, API server exploits, and
  misconfigured RBAC discovery. Kubernetes API servers have a broad attack surface
  and any unauthenticated information leak or authentication bypass vulnerability
  would be immediately reachable by external threat actors.

verification:
  - "List all EKS clusters: aws eks list-clusters"
  - "For each cluster, retrieve endpoint access configuration: aws eks describe-cluster --name <cluster> --query 'cluster.resourcesVpcConfig.{Public:endpointPublicAccess,Private:endpointPrivateAccess}'"
  - "Confirm endpointPublicAccess is false and endpointPrivateAccess is true for every cluster"
  - "If any cluster has public access enabled, verify it is restricted to a minimal CIDR allowlist as an interim control"

compliance:
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"

references:
  - "https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html"
  - "https://docs.aws.amazon.com/eks/latest/userguide/security_iam_id-based-policy-examples.html"
  - "https://docs.aws.amazon.com/eks/latest/userguide/network_reqs.html"
