id: "csmm-dat-005"
name: "RDS No Public Accessibility"
level: 1
pillar: "data"
priority: "critical"
severity_weight: 4

description: >
  All RDS instances and Aurora clusters must have the PubliclyAccessible attribute set to
  false. Databases must reside in private subnets with no route to an Internet Gateway.
  Application connectivity must be through private VPC networking, VPC peering, or AWS
  PrivateLink. Enforce via AWS Config rule 'rds-instance-public-access-check' and remediate
  immediately using the aws rds modify-db-instance --no-publicly-accessible command. Do not
  require a maintenance window for this change.

risk: >
  A publicly accessible RDS instance is directly reachable from the internet on its database
  port (3306 for MySQL, 5432 for PostgreSQL, 1433 for MSSQL). Automated scanners continuously
  discover and attempt credential attacks against any publicly reachable database port. A
  successful attack grants direct query access to all data, bypassing application-layer
  controls and audit logging. Databases contain the highest concentration of sensitive data
  in most architectures and must never be directly internet-reachable.

verification:
  - "Run: aws rds describe-db-instances | jq '[.DBInstances[] | select(.PubliclyAccessible == true)] | length' — expected 0."
  - "Run the equivalent check for Aurora: aws rds describe-db-clusters | jq '[.DBClusters[] | select(.PubliclyAccessible == true)] | length' — expected 0."
  - "Confirm AWS Config rule 'rds-instance-public-access-check' is ENABLED and reports COMPLIANT."
  - "Verify RDS instances are in subnets associated with a DB subnet group that contains only private subnets (no route to an IGW in the associated route table)."
  - "Attempt a direct TCP connection to the RDS endpoint from outside the VPC — connection must time out or be refused."

compliance:
  - framework: "CIS AWS Foundations"
    control: "2.3.2"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.6"
  - framework: "NIST 800-53"
    control: "SC-7"
  - framework: "AWS Well-Architected"
    control: "SEC 05 — How do you protect your network resources?"

references:
  - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html"
  - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.DBInstance.Modifying.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/rds-instance-public-access-check.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/rds-controls.html#rds-2"
