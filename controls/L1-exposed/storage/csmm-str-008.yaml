id: "csmm-str-008"
name: "Disable S3 ACLs (BucketOwnerEnforced)"
level: 1
pillar: "storage"
priority: "medium"
severity_weight: 2

description: >
  All S3 buckets must have Object Ownership set to BucketOwnerEnforced, which disables
  S3 ACLs entirely. With ACLs disabled, all access control is managed exclusively through
  bucket policies and IAM policies, which are auditable, versionable in IaC, and deny-by-default.
  Migrate existing buckets using aws s3api put-bucket-ownership-controls --ownership-controls
  'Rules=[{ObjectOwnership=BucketOwnerEnforced}]'. Enforce via AWS Config rule
  's3-bucket-acl-prohibited'.

risk: >
  S3 ACLs are a legacy access control mechanism that predate IAM and operate separately from
  bucket policies, making the effective access permissions on a bucket difficult to audit in
  a single policy review. ACLs can inadvertently grant cross-account or public access when
  PutObjectAcl operations are used in multi-party upload workflows. ACLs are not captured in
  standard IAM Access Analyzer findings, increasing the risk of undetected access grants.
  Disabling ACLs simplifies the access model to a single policy-based layer.

verification:
  - "Run: aws s3api list-buckets | jq -r '.Buckets[].Name' | xargs -I{} aws s3api get-bucket-ownership-controls --bucket {} | jq '.OwnershipControls.Rules[].ObjectOwnership' — all buckets must return 'BucketOwnerEnforced'."
  - "Confirm AWS Config rule 's3-bucket-acl-prohibited' is ENABLED and reports COMPLIANT."
  - "Attempt to set a canned ACL (e.g., public-read) on an object in a BucketOwnerEnforced bucket — the operation should fail with an InvalidArgument error."
  - "Verify IaC templates set object_ownership = 'BucketOwnerEnforced' on all S3 bucket resources and Checkov rule CKV2_AWS_65 passes in CI."

compliance:
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "AC-3"
  - framework: "AWS Well-Architected"
    control: "SEC 07 — How do you classify your data?"

references:
  - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html"
  - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-ownership-migrating-acls-prerequisites.html"
  - "https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-acl-prohibited.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-12"
