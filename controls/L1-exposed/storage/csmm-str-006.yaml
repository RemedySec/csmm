id: "csmm-str-006"
name: "RDS Encryption at Rest"
level: 1
pillar: "storage"
priority: "high"
severity_weight: 3

description: >
  All RDS instances and Aurora clusters must have encryption at rest enabled using an
  AWS KMS key. Encryption must be enabled at instance creation time — it cannot be enabled
  on an existing unencrypted instance in place. To encrypt an existing unencrypted instance,
  take a snapshot, copy the snapshot with encryption enabled, and restore from the encrypted
  snapshot. Use a customer-managed KMS key (CMK) for regulated workloads to maintain
  independent key control. Enforce via AWS Config rule 'rds-storage-encrypted'.

risk: >
  Unencrypted RDS storage means that if an attacker gains access to the underlying EBS volumes
  (through a hypervisor escape, a compromised AWS employee, or an improperly shared snapshot),
  the database files are immediately readable without any additional decryption. Unencrypted
  snapshots shared accidentally or accessed by a threat actor expose the full database contents.
  Encryption at rest also fulfills the baseline requirement for PCI-DSS, HIPAA, and most
  enterprise data governance policies that mandate encryption of stored data.

verification:
  - "Run: aws rds describe-db-instances | jq '[.DBInstances[] | select(.StorageEncrypted == false)] | length' — expected 0."
  - "Run: aws rds describe-db-clusters | jq '[.DBClusters[] | select(.StorageEncrypted == false)] | length' — expected 0."
  - "Confirm AWS Config rule 'rds-storage-encrypted' is ENABLED and reports COMPLIANT."
  - "For instances using CMKs, verify the KMS key is not the default aws/rds key: aws rds describe-db-instances | jq '.DBInstances[].KmsKeyId' — values should reference customer-managed key ARNs, not aws/rds aliases for regulated workloads."
  - "Verify key rotation is enabled on all CMKs used for RDS encryption: aws kms get-key-rotation-status --key-id <key-id>."

compliance:
  - framework: "CIS AWS Foundations"
    control: "2.3.1"
    version: "3.0"
  - framework: "SOC2"
    control: "CC6.1"
  - framework: "NIST 800-53"
    control: "SC-28"
  - framework: "AWS Well-Architected"
    control: "SEC 08 — How do you protect your data at rest?"

references:
  - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"
  - "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html#Overview.Encryption.Enabling"
  - "https://docs.aws.amazon.com/config/latest/developerguide/rds-storage-encrypted.html"
  - "https://docs.aws.amazon.com/securityhub/latest/userguide/rds-controls.html#rds-3"
